<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한라 학과 체험 | 준비 중</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #eef5ff; color: #102858; font-family: system-ui, sans-serif; }
    main { width: min(100%, 620px); background: white; border: 2px solid #306edb; border-radius: 16px; padding: clamp(24px, 6vw, 48px); box-shadow: 8px 8px 0 #d5e4ff; }
    .tag { display: inline-block; font-size: 13px; font-weight: 700; color: #245ec7; background: #edf4ff; padding: 8px 12px; border-radius: 8px; }
    h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.3; letter-spacing: -1px; }
    p { line-height: 1.8; color: #4f617d; }
    footer { margin-top: 32px; font-size: 12px; color: #65748d; }
  </style>
</head>
<body>
  <main>
    <span class="tag">학과 체험 프로젝트 · 준비 중</span>
    <h1>나에게 맞는 전공을<br>만나는 작은 체험</h1>
    <p>한라대학교 8개 학과를 알아보는 선택형 웹 게임을 준비하고 있습니다.</p>
    <p>이 페이지는 배포 연결 확인용입니다. 게임과 행사 신청 기능은 아직 제공하지 않습니다.</p>
    <footer>한라대학교 학과 체험 학생 프로젝트</footer>
  </main>
</body>
</html>
